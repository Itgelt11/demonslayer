<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 100px;
        height: 10px;
        background-color: aqua;
        position: relative;
      }
      .container:hover .box::after {
        width: 100px;
      }
      .box::after {
        content: "";
        width: 0;
        height: 5px;
        background-color: brown;
        position: absolute;
        bottom: 0;
        left: 0;
        transition: width ease 1s;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box"></div>
    </div>
  </body>
</html>
